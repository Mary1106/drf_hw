
services:
  web:
    build: .
    command: >
      sh -c "
        until pg_isready -h db -p 5432 -U $${POSTGRES_USER:-postgres}; do
          echo 'Waiting for PostgreSQL...';
          sleep 2;
        done &&
        python manage.py migrate &&
        python manage.py collectstatic --noinput &&
        gunicorn config.wsgi:application --bind 0.0.0.0:8000
      "
    ports:
      - "8000:8000"
    env_file:
      - ./.env.docker
    depends_on:
      - db
    volumes:
      - .:/app
      - static_volume:/app/static

  db:
    image: postgres:16
    env_file:
      - ./.env.docker
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"
    env_file:
      - ./.env.docker
    volumes:
      - redis_data:/data

  celery:
    build:
      context: .
    container_name: celery_worker
    command: celery -A config worker -l INFO
    env_file:
      - ./.env.docker
    volumes:
      - .:/app
    depends_on:
      - db
      - redis
      - web

  celery_beat:
    build:
      context: .
    container_name: celery_beat
    command: celery -A config beat --loglevel=INFO
    env_file:
      - ./.env.docker
    volumes:
      - .:/app
    depends_on:
      - db
      - redis
      - celery

  nginx:
    build: ./nginx  # путь к папке с Dockerfile.nginx
    ports:
      - "80:80"  # внешний порт:внутренний порт Nginx
    depends_on:
      - web  # зависит от Django-сервиса
    volumes:
      - static_volume:/app/static  # том для статических файлов
      - media_volume:/app/media    # том для медиа-файлов


volumes:
  postgres_data:
  static_volume:
  redis_data:
  media_volume:
